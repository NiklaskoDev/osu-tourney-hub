{#- Copies `text` to the clipboard; app.js swaps the label to `copied_label` for two seconds. -#}
{% from "components/icon.html" import icon %}
{% macro copy_button(text, label="Copy", copied_label="Copied") -%}
<button class="btn btn--secondary" type="button" data-copy="{{ text }}" data-copied-label="{{ copied_label }}">
  {{ icon("copy") }}
  <span data-copy-label>{{ label }}</span>
</button>
{%- endmacro %}
